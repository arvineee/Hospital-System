{% extends 'base.html'%}
{% load static %}


{% block title %}
    Login
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 w-100" style="max-width: 400px;">
        <div class="text-center mb-4">
            <img src="{% static 'img/hospital1.jpg' %}" alt="Hospital Logo" class="rounded-circle shadow mb-2" width="60" height="60">
            <h2 class="fw-bold mt-2">Login</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input class="form-control" type="text" id="username" name="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input class="form-control" type="password" id="password" name="password">
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Login</button>
        </form>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
