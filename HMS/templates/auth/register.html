{% extends 'base.html' %}
{% load static %}


{% block title %}
    Register
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <img src="{% static 'img/hospital1.jpg' %}" alt="Hospital Logo" class="rounded-circle shadow mb-2" width="70" height="70">
            <h2 class="fw-bold mt-2">User Registration</h2>
            <p class="text-muted">Create your account to access the system</p>
        </div>
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input class="form-control" type="text" id="username" name="username">
                </div>
            </div>
            <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input class="form-control" type="text" id="first_name" name="first_name">
                </div>
            </div>
            <div class="mb-3">
                <label for="last_name" class="form-label">Last Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                    <input class="form-control" type="text" id="last_name" name="last_name">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input class="form-control" type="email" id="email" name="email">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input class="form-control" type="password" id="password" name="password">
                </div>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input class="form-control" type="password" id="confirm_password" name="confirm_password">
                </div>
            </div>
            <div class="mb-4">
                <label for="role" class="form-label">Role</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-gear"></i></span>
                    <select class="form-select" id="role" name="role">
                        <option value="">Select Role</option>
                        <option value="doctor">Doctor</option>
                        <option value="pharmacist">Pharmacist</option>
                        <option value="lab_tech">Lab Technician</option>
                        <option value="radiologist">Radiologist</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-lg btn-success w-100 py-2 fw-bold">Register</button>
        </form>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
