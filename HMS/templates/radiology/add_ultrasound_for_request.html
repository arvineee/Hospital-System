{% extends 'base.html' %}

{% block title %}Add Ultrasound for Request{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Add Ultrasound for {{ patient.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Patient</label>
            <input type="text" class="form-control" value="{{ patient.name }}" readonly>
            <input type="hidden" name="patient_id" value="{{ patient.id }}">
        </div>
        <div class="mb-3">
            <label for="id_ultrasound_type" class="form-label">Ultrasound Type</label>
            <input type="text" name="ultrasound_type" id="id_ultrasound_type" class="form-control" required value="{{ us_request.ultrasound_type }}">
        </div>
        <div class="mb-3">
            <label for="id_findings" class="form-label">Findings</label>
            <textarea name="findings" id="id_findings" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label for="id_image" class="form-label">Image</label>
            <input type="file" name="image" id="id_image" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'ultrasound_requests_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
