{% extends 'base.html' %}
{% block title %}Delete Ultrasound{% endblock %}
{% block content %}
<div class="container">
    <div class="alert alert-danger mt-4">
        <h4 class="alert-heading">Confirm Delete</h4>
        <p>Are you sure you want to delete this ultrasound record for <strong>{{ ultrasound.patient }}</strong> dated <strong>{{ ultrasound.date }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'ultrasound-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
