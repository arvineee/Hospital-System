{% extends 'base.html' %}
{% block title %}Edit Patient History{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning text-dark">
            <h3>Edit Patient History Entry</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="signs" class="form-label">Signs</label>
                        <textarea class="form-control" id="signs" name="signs" rows="2">{{ history_entry.signs }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label for="symptoms" class="form-label">Symptoms</label>
                        <textarea class="form-control" id="symptoms" name="symptoms" rows="2">{{ history_entry.symptoms }}</textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label for="temperature" class="form-label">Temperature (°C)</label>
                        <input type="number" step="0.1" class="form-control" id="temperature" name="temperature" value="{{ history_entry.temperature }}">
                    </div>
                    <div class="col-md-2">
                        <label for="blood_pressure" class="form-label">Blood Pressure</label>
                        <input type="text" class="form-control" id="blood_pressure" name="blood_pressure" value="{{ history_entry.blood_pressure }}">
                    </div>
                    <div class="col-md-2">
                        <label for="pulse" class="form-label">Pulse</label>
                        <input type="number" class="form-control" id="pulse" name="pulse" value="{{ history_entry.pulse }}">
                    </div>
                    <div class="col-md-2">
                        <label for="respiratory_rate" class="form-label">Respiratory Rate</label>
                        <input type="number" class="form-control" id="respiratory_rate" name="respiratory_rate" value="{{ history_entry.respiratory_rate }}">
                    </div>
                    <div class="col-md-2">
                        <label for="spo2" class="form-label">SpO2 (%)</label>
                        <input type="number" class="form-control" id="spo2" name="spo2" value="{{ history_entry.spo2 }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="hpi" class="form-label">History of Present Illness (HPI)</label>
                    <textarea class="form-control" id="hpi" name="hpi" rows="2">{{ history_entry.hpi }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="diagnosis" class="form-label">Diagnosis</label>
                    <input type="text" class="form-control" id="diagnosis" name="diagnosis" value="{{ history_entry.diagnosis }}">
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ history_entry.notes }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="draft" {% if history_entry.status == 'draft' %}selected{% endif %}>Draft</option>
                        <option value="final" {% if history_entry.status == 'final' %}selected{% endif %}>Finalized</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="{% url 'patient_history' history_entry.patient.id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
