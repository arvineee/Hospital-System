{% extends 'base.html' %}
{% block title %}Update Payment - {{ patient.name }}{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Update Payment Status</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Total Bill (KSH)</label>
                            <input type="text" class="form-control" value="{{ bill.total_amount }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount Paid (KSH)</label>
                            <input type="number" class="form-control" name="paid_amount" min="0" max="{{ bill.due_amount }}" value="{{ bill.due_amount }}" readonly required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select" name="payment_method" required>
                                <option value="" disabled {% if not bill.payment_method %}selected{% endif %}>Select</option>
                                <option value="cash" {% if bill.payment_method == 'cash' %}selected{% endif %}>Cash</option>
                                <option value="paybill" {% if bill.payment_method == 'paybill' %}selected{% endif %}>Paybill (Mobile Money)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Payment Reference (if Paybill)</label>
                            <input type="text" class="form-control" name="payment_reference" value="{{ bill.payment_reference }}" placeholder="e.g. M-PESA Code">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Payment Status</label>
                            <select class="form-select" name="is_paid" required>
                                <option value="False" {% if not bill.is_paid %}selected{% endif %}>Unpaid</option>
                                <option value="True" {% if bill.is_paid %}selected{% endif %}>Paid</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'billing' patient.id %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Update Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
