{% extends 'base.html' %}
{% block title %}Request Laboratory Test{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Request Laboratory Test for {{ patient.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="test_id" class="form-label">Select Test</label>
            <select class="form-select" id="test_id" name="test_id" required>
                <option value="">-- Select Test --</option>
                {% for test in available_tests %}
                <option value="{{ test.id }}">{{ test.test_name }} ({{ test.labaratory.labaratory_name }}) - ${{ test.test_price }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="notes" class="form-label">Notes (optional)</label>
            <textarea class="form-control" id="notes" name="notes"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Request Test</button>
        <a href="{% url 'pat_view' patient.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
